version: "3.9"

services:

  ml-api:
    build: .
    container_name: prosensia-ml-service

    ports:
      - "8000:8000"

    env_file:
      - .env

  prometheus:
    image: prom/prometheus

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - ml-api

  grafana:
    image: grafana/grafana

    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus